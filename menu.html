<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>sakura cafe メニュー</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-pink-50">
        <header class="bg-green-100 shadow px-6 py-4">
            <h1 class="text-3xl font-bold text-gray-800 text-center">SAKURA CAFE</h1>
            <p class="text-gray-600 text-sm mt-1 text-center">日本の桜</p>
        </header>

        <main class="max-w-2xl mx-auto px-4 py-8">
            <section class="mb-8">
                <h2 class="text-2xl font-bold text-gray-700 mb-4 border-b-2 border-pink-300 pb-2">Cake</h2>

                <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg hover:bg-pink-100">
                    <h3 class="text-lg font-bold text-gray-900">桜のケーキ</h3>
                    <p class="text-gray-600 mt-1">桜モチーフのシフォンケーキ</p>
                    <p class="text-blue-600 font-bold mt-2">¥700</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg hover:bg-pink-100">
                    <h3 class="text-lg font-bold text-gray-900">梅のケーキ</h3>
                    <p class="text-gray-600 mt-1">梅のパウンドケーキ</p>
                    <p class="text-blue-600 font-bold mt-2">¥750</p>
                </div>
            </section>

            <section class="mb-8">
                <h2 class="text-2xl font-bold text-gray-700 mb-4 border-b-2 border-pink-300 pb-2">Drink</h2>

                <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg hover:bg-pink-100">
                    <h3 class="text-lg font-bold text-gray-900">桜ラテ</h3>
                    <p class="text-gray-600 mt-1">桜風味のカフェラテ</p>
                    <p class="text-blue-600 font-bold mt-2">¥500</p>
                </div>
                <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg hover:bg-pink-100">
                    <h3 class="text-lg font-bold text-gray-900">桜ソーダ</h3>
                    <p class="text-gray-600 mt-1">桜をイメージしたいちごソーダ</p>
                    <p class="text-blue-600 font-bold mt-2">¥500</p>               
                </div>
            </section>
        </main>
    </body>
</html>
